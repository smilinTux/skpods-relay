[package]
name = "skpods-relay"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Ping relay for SKPods Chat"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.9.0"
rsa = { version = "0.10.0", default-features = false, features = ["pkcs1v15"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
sha2 = "0.11.1"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
async-trait = "0.1.92"

[dev-dependencies]
futures = { version = "0.3.34", features = ["executor"] }
rand = { version = "0.10.4", default-features = false, features = ["chacha"] }

[profile.release]
opt-level = "s"
lto = true

# RSA key generation in the tests is very slow without optimised dependencies.
[profile.dev.package."*"]
opt-level = 2
